# Merge-blocking checks. Both jobs run the scripts in scripts/, so a local
# scripts/check.sh and scripts/smoke.sh reproduce them. See docs/QUALITY.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install the pinned toolchain
        # rustup reads rust-toolchain.toml; no separate toolchain action or version here.
        run: |
          rustup toolchain install
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: debug

      - name: Format
        run: scripts/fmt-check.sh

      - name: Lint
        run: scripts/lint.sh

      - name: Test
        run: scripts/test.sh

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Smoke
        run: scripts/smoke.sh

      - name: Write summary
        if: always()
        run: |
          {
            echo '## Smoke run (500 ticks, seed 42)'
            echo
            echo '```'
            cat smoke.txt 2>/dev/null || echo '(no smoke.txt produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-summary
          path: smoke.txt
          retention-days: 30
          if-no-files-found: warn
