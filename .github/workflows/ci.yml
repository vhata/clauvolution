# Merge-blocking checks and queue hygiene. Every job calls a script in
# scripts/ or docket/scripts/, so a local scripts/check.sh and scripts/smoke.sh
# reproduce the Rust jobs and bash docket/scripts/ci.sh the hygiene job. See
# docs/QUALITY.md.
name: CI

on:
  pull_request:
    # edited: the hygiene job reads the PR body from the event payload, and a
    # re-run reuses the original payload, so a changed body needs a new run.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# A new push to a PR cancels the superseded run. Pushes to main get a group
# per commit, so a burst of merges neither cancels nor replaces a queued run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  workflow:
    name: Queue and PR hygiene
    # Queue structure, relative Markdown links and, on pull requests, the PR
    # markers against the queues. Shell and awk only, no toolchain.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The marker check reads the queues at the base branch and at HEAD.
          fetch-depth: 0

      # One call to the vendored entry point. The PR variables are empty on
      # pushes to main, which skips the marker check.
      - name: Queue, link and marker checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash docket/scripts/ci.sh

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install the pinned toolchain
        # rustup reads rust-toolchain.toml; no separate toolchain action or version here.
        run: |
          rustup toolchain install
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: debug

      - name: Format
        run: scripts/fmt-check.sh

      - name: Lint
        run: scripts/lint.sh

      - name: Test
        run: scripts/test.sh

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Smoke
        run: scripts/smoke.sh

      - name: Write summary
        if: always()
        run: |
          {
            echo '## Smoke run (500 ticks, seed 42)'
            echo
            echo '```'
            cat smoke.txt 2>/dev/null || echo '(no smoke.txt produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-summary
          path: smoke.txt
          retention-days: 30
          if-no-files-found: warn
