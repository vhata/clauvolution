# Re-validates the PR description when it is edited or the PR is marked ready,
# events that CI does not run on. It runs the same single entry point as CI's
# hygiene job, bash docket/scripts/ci.sh, with the PR variables set, so the
# queue, link and marker checks are identical in both places. A separate
# workflow so that editing the description does not rebuild the Rust jobs.
# Local equivalent: bash docket/scripts/check-pr-markers.sh --pr <number>.
# See docs/QUALITY.md.
name: PR markers

on:
  pull_request:
    types: [edited, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  markers:
    # Editing the description of a merged or closed PR does not re-check it.
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The script reads the queues at the base branch and at HEAD, the
          # merge commit of the PR into its base.
          fetch-depth: 0

      - name: Queue, link and marker checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash docket/scripts/ci.sh
