# Git hooks, installed with scripts/setup.sh (which runs `lefthook install`).
# Each hook calls the matching script in scripts/, so the hook and the CI
# job run the same code. See docs/QUALITY.md.

pre-commit:
  parallel: true
  jobs:
    - name: fmt-check
      run: scripts/fmt-check.sh
    - name: lint
      run: scripts/lint.sh

pre-push:
  jobs:
    # The wrapper reads git's pushed refs on stdin and skips scripts/test.sh
    # when only docs changed. FORCE_TESTS=1 runs it anyway.
    - name: test
      run: scripts/pre-push-test.sh {1}
      use_stdin: true
